name: Build APK (fork)

on:
  push:
    branches: [ zh-cn ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an Android SDK already; android-actions/setup-android@v3
      # is broken (it installs the long-removed 'tools' package), so use it directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias gotify \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gotifyfork -keypass gotifyfork \
            -dname "CN=GotifyPlus Fork, OU=otscup, O=otscup, C=CN"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: gotifyfork
          ANDROID_KEY_ALIAS: gotify
          ANDROID_KEY_PASSWORD: gotifyfork
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gotify-plus-zh-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload signing keystore (save it to keep future upgrades installable)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: ${{ runner.temp }}/release.keystore
