name: Build APK (fork)

on:
  push:
    branches: [ zh-cn ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors the upstream release.yml: the runner image's preinstalled Android
      # SDK is used as-is (no sdkmanager step — 'platforms;android-37' is not a
      # published sdkmanager package name, and setup-android@v3 is broken).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same keystore as the v1.1.0 release (~/workspace/gotify-plus-build/release.keystore),
      # stored as repo secrets so every build signs with the identical key and
      # stays installable over the previous APK. Required secrets:
      # ANDROID_KEYSTORE_BASE64 (base64 of the keystore file),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Never generate a fresh keystore here: a new key breaks upgrades.
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gotify-plus-zh-apk
          path: app/build/outputs/apk/release/*.apk
